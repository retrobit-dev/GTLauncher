<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#e2e4e1">
  <title>GTLauncher — Live Weather Preview</title>
  <link rel="stylesheet" href="./styles.css?v=live-sky-23">
  <script src="./app.js?v=live-sky-134" defer></script>
</head>
<body>
  <main class="preview-stage" aria-label="Pratinjau GTLauncher">
    <div class="device-frame" aria-label="Huawei MatePad Mini dalam orientasi lanskap">
      <div class="device-display" aria-label="Homescreen GTLauncher dengan langit dan pulau terapung pixel art yang mengikuti cuaca">
        <canvas id="sky-canvas" class="sky-canvas" aria-label="Langit pixel art dan pulau terapung dengan pencahayaan adaptif serta efek cuaca"></canvas>
        <span class="camera-punch-hole" aria-hidden="true"></span>
      </div>
    </div>
    <section class="preview-controls" aria-label="Kontrol suasana preview">
      <p id="weather-mode-label" class="weather-mode-label" aria-live="polite">Suasana: Live · Open-Meteo</p>
      <button id="weather-cycle-button" class="weather-cycle-button" type="button" aria-label="Ganti suasana preview">
        Ganti suasana
      </button>
    </section>
  </main>
</body>
</html>
